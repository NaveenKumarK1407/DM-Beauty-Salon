# Firebase App Hosting — DM Beauty Parlour
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Credentials: add in Firebase Console → App Hosting → your backend → Settings → Environment
# (paste the contents of .env.local), OR set secrets below with:
#   firebase apphosting:secrets:set FIREBASE_PRIVATE_KEY --project dm-beauty-medak
#
# Console values override this file when both define the same variable.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public site URL — update after first deploy to your .web.app URL, then to your custom domain.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://dm-beauty-salon.web.app
    availability:
      - BUILD
      - RUNTIME

  # ── Firebase Web SDK (client) — copy from Firebase Console → Project settings → Your apps ──
  # Add these in the Firebase Console Environment tab (recommended), or uncomment and fill here:
  # - variable: NEXT_PUBLIC_FIREBASE_API_KEY
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  #   value: dm-beauty-medak
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_APP_ID
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  #   availability: [BUILD, RUNTIME]

  # ── Firebase Admin SDK (server) — use Secret Manager, never commit values ──
  - variable: FIREBASE_PROJECT_ID
    value: dm-beauty-medak
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
